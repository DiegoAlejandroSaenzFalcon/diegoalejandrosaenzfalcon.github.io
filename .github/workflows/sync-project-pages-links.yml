name: Sync project Pages links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish supplied certificate images and clean duplicates
        shell: python
        run: |
          from pathlib import Path
          import base64, re
          from PIL import Image

          out = Path('assets/credentials/sena')
          out.mkdir(parents=True, exist_ok=True)
          for key, filename in [('sgsst','sgsst.jpg'),('arh','arh.jpg'),('adl','adl.jpg')]:
              raw = re.sub(r'\s+', '', Path(f'.tmp/{key}.b64').read_text(encoding='utf-8'))
              raw += '=' * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw)
              target = out / filename
              target.write_bytes(data)
              with Image.open(target) as im:
                  im.verify()
              print(f'{filename}: {len(data)} bytes, valid JPEG')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove only the two duplicate, text-only Coursera cards.
          for title in ('The Bits and Bytes of Computer Networking', 'Technical Support Fundamentals'):
              pattern = re.compile(
                  r'<article\s+class=["\']edu["\'][^>]*>.*?<h3>\s*' + re.escape(title) + r'\s*</h3>.*?</article>',
                  re.I | re.S,
              )
              text = pattern.sub('', text)

          # Replace each SENA viewer with the locally published image supplied by the user.
          replacements = {
              '9210001495565CC1070596699C': ('sgsst.jpg', 'Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
              '9208001508287CC1070596699C': ('arh.jpg', 'Administración de Recursos Humanos'),
              '9232001529759CC1070596699C': ('adl.jpg', 'Administración Documental en el Entorno Laboral'),
          }
          for code, (filename, title) in replacements.items():
              image = f'<img class="sena-preview" src="assets/credentials/sena/{filename}" alt="{title}" loading="lazy">'
              text, count = re.subn(r'<iframe[^>]*' + re.escape(code) + r'[^>]*></iframe>', image, text, flags=re.I | re.S)
              print(code, 'viewer replacements:', count)

          # Normalize existing SENA cards to the three supplied images, preserving their text/metadata.
          cards = list(re.finditer(r'<article\s+class=["\']sena-card["\'][^>]*>', text, re.I))
          ordered = [('sgsst.jpg','Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),('arh.jpg','Administración de Recursos Humanos'),('adl.jpg','Administración Documental en el Entorno Laboral')]
          for i in range(min(3, len(cards)) - 1, -1, -1):
              start = cards[i].start()
              end = cards[i+1].start() if i + 1 < len(cards) else len(text)
              block = text[start:end]
              image = f'<img class="sena-preview" src="assets/credentials/sena/{ordered[i][0]}" alt="{ordered[i][1]}" loading="lazy">'
              block = re.sub(r'<img\b[^>]*class=["\']sena-preview["\'][^>]*>', image, block, count=1, flags=re.I | re.S)
              text = text[:start] + block + text[end:]

          css = '.sena-preview{width:100%;height:430px;object-fit:contain;display:block;background:#07101d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}'
          if '.sena-preview{' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          p.write_text(text, encoding='utf-8')

      - name: Validate final portfolio
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/credentials/sena/sgsst.jpg
          test -s assets/credentials/sena/arh.jpg
          test -s assets/credentials/sena/adl.jpg
          test "$(grep -o 'class=\"sena-card\"' index.html | wc -l | tr -d ' ')" = "3"
          test "$(grep -o 'class=\"sena-preview\"' index.html | wc -l | tr -d ' ')" = "3"
          ! grep -q '<iframe' index.html

      - name: Remove temporary staging and obsolete credential workflows
        shell: bash
        run: |
          rm -f .tmp/sgsst.b64 .tmp/arh.b64 .tmp/adl.b64
          rm -f .tmp/credential-bundle.b64 .tmp/credential-bundle.part1 .tmp/credential-bundle.part2 .tmp/credential-bundle.part3 .tmp/credential-bundle.part4
          rm -f .github/workflows/update-credential-previews.yml .github/workflows/fix-coursera-duplicates.yml .github/workflows/apply-credential-audit.yml

      - name: Commit final result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/credentials/sena .tmp .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: finalize credential evidence without duplicates'
          git push
