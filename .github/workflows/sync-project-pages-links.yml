name: Sync project Pages links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final portfolio corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # SEO / structured data / location
          s = s.replace('<title>Diego Alejandro Saenz Falcon | Tecnología, TI y Soluciones Digitales</title>', '<title>Diego Alejandro Saenz Falcon | Sistemas, Infraestructura y Tecnología TI</title>')
          s = s.replace('Portafolio profesional de Diego Alejandro Saenz Falcon: soporte TI, sistemas, redes, hardware, software, desarrollo web, automatización y experiencia operativa.', 'Diego Alejandro Saenz Falcon | Sistemas, infraestructura TI, soporte técnico, redes, Linux, Windows, automatización y desarrollo web. Bogotá, Colombia.')
          s = s.replace('Diego Saenz Falcon, soporte TI, soporte técnico, redes, Linux, Windows, Cisco, hardware, software, desarrollo web, JavaScript, PHP, Python, automatización, Girardot, Colombia', 'Diego Saenz Falcon, soporte TI, soporte técnico, sistemas, infraestructura TI, redes, Linux, Windows, Cisco, hardware, software, desarrollo web, JavaScript, PHP, Python, automatización, Bogotá, Colombia')
          s = s.replace('"jobTitle":"Tecnología y Soporte Técnico"', '"jobTitle":"Tecnología, Sistemas e Infraestructura TI"')
          s = s.replace('"addressLocality":"Girardot","addressRegion":"Cundinamarca"', '"addressLocality":"Bogotá","addressRegion":"Bogotá D.C."')
          s = s.replace('Girardot · Cundinamarca · Colombia', 'Bogotá · Colombia')
          s = s.replace('ubicado en <strong>Girardot, Cundinamarca, Colombia</strong>', 'ubicado en <strong>Bogotá, Colombia</strong>')
          s = s.replace('Girardot, Cundinamarca, Colombia', 'Bogotá, Colombia')
          s = s.replace('Girardot, Cundinamarca', 'Bogotá, Colombia')
          s = s.replace('Tecnología<br>que <span class="gradient">resuelve.</span>', 'Sistemas<br>que <span class="gradient">funcionan.</span>')

          # Live project Pages
          replacements = {
            'https://github.com/DiegoAlejandroSaenzFalcon/Soluciona-Inteligencia-Artificial':'https://diegoalejandrosaenzfalcon.github.io/Soluciona-Inteligencia-Artificial/',
            'https://github.com/DiegoAlejandroSaenzFalcon/Automatizacion-de-Datos':'https://diegoalejandrosaenzfalcon.github.io/Automatizacion-de-Datos/',
            'https://github.com/DiegoAlejandroSaenzFalcon/Tecnologias-de-la-Informacion':'https://diegoalejandrosaenzfalcon.github.io/Tecnologias-de-la-Informacion/',
            'https://github.com/DiegoAlejandroSaenzFalcon/Red-Hat-Enterprise-Linux':'https://diegoalejandrosaenzfalcon.github.io/Red-Hat-Enterprise-Linux/',
            'https://github.com/DiegoAlejandroSaenzFalcon/Windows-11-Professional':'https://diegoalejandrosaenzfalcon.github.io/Windows-11-Professional/',
            'https://github.com/DiegoAlejandroSaenzFalcon/Trading-Ciencia':'https://diegoalejandrosaenzfalcon.github.io/Trading-Ciencia/',
            'https://github.com/DiegoAlejandroSaenzFalcon/Directivas-de-Seguridad-IA':'https://diegoalejandrosaenzfalcon.github.io/Directivas-de-Seguridad-IA/'
          }
          for a,b in replacements.items(): s=s.replace(a,b)

          # Correct terminology for pending Politécnico certificates
          s=s.replace('Diplomados certificados','Formación complementaria · certificación pendiente')
          s=s.replace('Diplomado certificado','Formación complementaria · certificación pendiente')
          s=s.replace('Certificado</span>','Certificación pendiente</span>')
          s=s.replace('Politécnico de Colombia con registros de verificación proporcionados.', 'Formación complementaria aprobada en el Politécnico de Colombia. La expedición de las certificaciones oficiales se encuentra pendiente de completar el proceso de pago institucional.')
          s=s.replace('Ver registro','Proceso institucional')

          # Add certificate evidence styles once.
          if '.cert-real-image{' not in s:
            css='''<style>.cert-real-image{height:245px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}.cert-real-image img{width:100%;height:100%;object-fit:contain}.cert-real-image .real-badge{position:absolute;top:14px;right:14px;padding:6px 9px;border-radius:8px;background:rgba(4,10,18,.78);color:#c6ffde;border:1px solid rgba(69,230,160,.18);font-size:.61rem;font-weight:900}.sena-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.sena-card{overflow:hidden;border:1px solid var(--border);border-radius:21px;background:linear-gradient(145deg,rgba(16,26,45,.84),rgba(8,14,25,.72));transition:.3s var(--ease)}.sena-card:hover{transform:translateY(-6px);border-color:var(--border-2)}.sena-image{height:260px;background:#fff;display:grid;place-items:center;overflow:hidden}.sena-image img{width:100%;height:100%;object-fit:contain}.sena-body{padding:20px}.sena-body h3{font-family:"Space Grotesk",sans-serif;font-size:1rem;margin-bottom:7px}.sena-body p{color:var(--muted);font-size:.72rem}.sena-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.sena-meta span{padding:5px 7px;border:1px solid var(--border);border-radius:7px;color:var(--text-2);font-size:.61rem;font-weight:800}.support-strip{display:flex;justify-content:space-between;gap:25px;align-items:center;margin-top:22px;padding:20px 22px;border:1px solid rgba(255,209,102,.14);border-radius:18px;background:linear-gradient(90deg,rgba(255,209,102,.05),rgba(255,255,255,.018));color:var(--text-2);font-size:.78rem}.support-strip p{margin-top:7px;color:var(--muted);max-width:900px}.support-price{flex-shrink:0;text-align:center;font-family:"Space Grotesk",sans-serif;font-size:1.4rem;color:#fff}.support-price small{font-family:"DM Sans",sans-serif;color:var(--muted);font-size:.65rem}.contact-grid-expanded{grid-template-columns:repeat(2,1fr)}@media (max-width:1050px){.sena-grid{grid-template-columns:1fr 1fr}}@media (max-width:700px){.sena-grid{grid-template-columns:1fr}.contact-grid-expanded{grid-template-columns:1fr}.support-strip{flex-direction:column;align-items:flex-start}}</style>'''
            s=s.replace('</style>',css+'\n</style>',1)

          # Add real Coursera certificate images once.
          if 'CERTIFICATE_LANDING_PAGE~L2E5A3L9QZAR' not in s:
            marker='<div class="cert-body">'
            s=s.replace(marker,'<div class="cert-real-image"><img src="https://s3.amazonaws.com/coursera_assets/meta_images/generated/CERTIFICATE_LANDING_PAGE/CERTIFICATE_LANDING_PAGE~L2E5A3L9QZAR/CERTIFICATE_LANDING_PAGE~L2E5A3L9QZAR.jpeg" alt="Certificado The Bits and Bytes of Computer Networking" loading="lazy"><span class="real-badge">Documento original</span></div>'+marker,1)
            s=s.replace(marker,'<div class="cert-real-image"><img src="https://s3.amazonaws.com/coursera_assets/meta_images/generated/CERTIFICATE_LANDING_PAGE/CERTIFICATE_LANDING_PAGE~YSGTRJJ49AIN/CERTIFICATE_LANDING_PAGE~YSGTRJJ49AIN.jpeg" alt="Certificado Technical Support Fundamentals" loading="lazy"><span class="real-badge">Documento original</span></div>'+marker,1)

          # SENA evidence section, sourced from repository assets already present.
          if 'id="credenciales-sena"' not in s:
            sena='''<section class="section" id="credenciales-sena"><div class="container"><div class="heading"><span class="eyebrow">Credenciales SENA</span><h2>Evidencia documental <span class="gradient">de formación.</span></h2><p>Certificados SENA conservados como evidencia documental, con sus códigos de verificación oficiales.</p></div><div class="sena-grid"><article class="sena-card"><div class="sena-image"><img src="assets/credentials/sena/sgsst.jpg" alt="Certificado SENA: Sistema de Gestión de la Seguridad y Salud en el Trabajo (SG-SST)"></div><div class="sena-body"><h3>Sistema de Gestión de la Seguridad y Salud en el Trabajo (SG-SST)</h3><p>SENA · 50 horas · 30 ago. 2017</p><div class="sena-meta"><span>ID 9210001495565CC1070596699C</span></div><a class="small-button" style="margin-top:14px" href="https://certificados.sena.edu.co/CertificadoDigital/com.sena.guardar?var1=9210001495565CC1070596699C" target="_blank" rel="noopener noreferrer">Verificación oficial</a></div></article><article class="sena-card"><div class="sena-image"><img src="assets/credentials/sena/arh.jpg" alt="Certificado SENA: Administración de Recursos Humanos"></div><div class="sena-body"><h3>Administración de Recursos Humanos</h3><p>SENA · 40 horas · 11 sep. 2017</p><div class="sena-meta"><span>ID 9208001508287CC1070596699C</span></div><a class="small-button" style="margin-top:14px" href="https://certificados.sena.edu.co/CertificadoDigital/com.sena.guardar?var1=9208001508287CC1070596699C" target="_blank" rel="noopener noreferrer">Verificación oficial</a></div></article><article class="sena-card"><div class="sena-image"><img src="assets/credentials/sena/adl.jpg" alt="Certificado SENA: Administración Documental en el Entorno Laboral"></div><div class="sena-body"><h3>Administración Documental en el Entorno Laboral</h3><p>SENA · 40 horas · 09 oct. 2017</p><div class="sena-meta"><span>ID 9232001529759CC1070596699C</span></div><a class="small-button" style="margin-top:14px" href="https://certificados.sena.edu.co/CertificadoDigital/com.sena.guardar?var1=9232001529759CC1070596699C" target="_blank" rel="noopener noreferrer">Verificación oficial</a></div></article></div><div class="support-strip"><div><strong>Una vía de apoyo voluntario profesional para completar estas certificaciones:</strong><p>Quien desee respaldar este proceso puede realizar el pago directamente en la pasarela institucional correspondiente. El portafolio no recibe ni administra recursos. Como reconocimiento, se podrá registrar una mención de honor permanente para quien cubra voluntariamente una certificación y desee ser reconocido.</p></div><div class="support-price">$80.000 COP<br><small>por certificación</small></div></div></div></section>'''
            s=s.replace('<section class="section" id="proyectos">',sena+'<section class="section" id="proyectos">',1)

          # Restore Politécnico credential evidence explicitly.
          if 'id="politecnico"' not in s:
            politecnico='''<section class="section" id="politecnico"><div class="container"><div class="heading"><span class="eyebrow">Politécnico de Colombia</span><h2>Formación complementaria <span class="gradient">aprobada.</span></h2><p>Diplomados · certificación pendiente. La formación fue aprobada; la expedición de las certificaciones oficiales se encuentra pendiente de completar el proceso de pago institucional.</p></div><div class="sena-grid"><article class="sena-card"><div class="sena-image"><img src="https://politecnicodecolombia.edu.co/certificados/diplomados/Talento%20Humano.png" alt="Politécnico de Colombia: Gestión del Talento Humano" loading="lazy"></div><div class="sena-body"><h3>Gestión del Talento Humano</h3><p>Formación complementaria aprobada.</p><div class="sena-meta"><span>Politécnico de Colombia</span><span>Certificación pendiente</span></div><div class="diploma-buttons" style="margin-top:14px"><a class="small-button" href="https://politecnicodecolombia.edu.co/certificados/certificados/controlador/pagar.php?Id=k7Nq48l6vA5G912bzJdZ" target="_blank" rel="noopener noreferrer"><i class="ri-bank-card-line"></i> Expedición oficial</a></div></div></article><article class="sena-card"><div class="sena-image"><img src="https://politecnicodecolombia.edu.co/certificados/diplomados/Marketing.png" alt="Politécnico de Colombia: Community Management" loading="lazy"></div><div class="sena-body"><h3>Community Management</h3><p>Formación complementaria aprobada.</p><div class="sena-meta"><span>Politécnico de Colombia</span><span>Certificación pendiente</span></div><div class="diploma-buttons" style="margin-top:14px"><a class="small-button" href="https://politecnicodecolombia.edu.co/certificados/certificados/controlador/pagar.php?Id=3JwdxWX6meJKZ6qgaezK" target="_blank" rel="noopener noreferrer"><i class="ri-bank-card-line"></i> Expedición oficial</a></div></div></article><article class="sena-card"><div class="sena-image"><img src="https://politecnicodecolombia.edu.co/certificados/diplomados/Marketing.png" alt="Politécnico de Colombia: Instagram para el Desarrollo de Marcas" loading="lazy"></div><div class="sena-body"><h3>Instagram para el Desarrollo de Marcas</h3><p>Formación complementaria aprobada.</p><div class="sena-meta"><span>Politécnico de Colombia</span><span>Certificación pendiente</span></div><div class="diploma-buttons" style="margin-top:14px"><a class="small-button" href="https://politecnicodecolombia.edu.co/certificados/certificados/controlador/pagar.php?Id=PEa9rZWp9P4YmD8AqQl5" target="_blank" rel="noopener noreferrer"><i class="ri-bank-card-line"></i> Expedición oficial</a></div></div></article></div><div class="support-strip"><div><strong>Una vía de apoyo voluntario profesional para completar estas certificaciones:</strong><p>Quien desee respaldar este proceso puede realizar el pago directamente en la pasarela institucional correspondiente. El portafolio no recibe ni administra recursos. Como reconocimiento, se podrá registrar una <strong>mención de honor permanente</strong> para quien cubra voluntariamente una certificación y desee ser reconocido.</p></div><div class="support-price">$80.000 COP<br><small>por certificación</small></div></div></div></section>'''
            target='<section class="section" id="proyectos">'
            if target in s:
              s=s.replace(target,politecnico+target,1)
            else:
              s=s.replace('</main>',politecnico+'</main>',1)

          # Replace contact section with the professional contact structure.
          start=s.find('<section class="section" id="contacto">')
          if start!=-1:
            end=s.find('</section>',start)
            if end!=-1 and 'Línea empresarial · Soluciona Inteligencia Artificial' not in s[start:end]:
              end += len('</section>')
              contact='''<section class="section" id="contacto"><div class="container"><div class="contact"><span class="eyebrow">Contacto profesional</span><h2>Convirtamos una necesidad en una <span class="gradient">solución.</span></h2><p>Disponible para oportunidades relacionadas con soporte TI, sistemas, redes, infraestructura, desarrollo web, automatización, operaciones y proyectos digitales.</p><div class="contact-grid contact-grid-expanded"><a class="contact-item" href="tel:+573134348629"><span class="contact-icon"><i class="ri-phone-line"></i></span><span><span class="contact-label">Contacto profesional · Diego Saenz Falcon</span><span class="contact-value">+57 313 434 8629</span></span></a><a class="contact-item" href="https://wa.me/573134348629" target="_blank" rel="noopener noreferrer"><span class="contact-icon"><i class="ri-whatsapp-line"></i></span><span><span class="contact-label">WhatsApp · Diego Saenz Falcon</span><span class="contact-value">+57 313 434 8629</span></span></a><a class="contact-item" href="tel:+573224303964"><span class="contact-icon"><i class="ri-phone-line"></i></span><span><span class="contact-label">Línea empresarial · Soluciona Inteligencia Artificial</span><span class="contact-value">+57 322 430 3964</span></span></a><a class="contact-item" href="https://wa.me/573224303964" target="_blank" rel="noopener noreferrer"><span class="contact-icon"><i class="ri-whatsapp-line"></i></span><span><span class="contact-label">WhatsApp · Soluciona Inteligencia Artificial</span><span class="contact-value">+57 322 430 3964</span></span></a><a class="contact-item" href="mailto:diegoalejandrosaenzfalcon@gmail.com"><span class="contact-icon"><i class="ri-mail-line"></i></span><span><span class="contact-label">Email</span><span class="contact-value">diegoalejandrosaenzfalcon@gmail.com</span></span></a><a class="contact-item" href="https://www.linkedin.com/in/diegosaenzfalcon" target="_blank" rel="noopener noreferrer"><span class="contact-icon"><i class="ri-linkedin-fill"></i></span><span><span class="contact-label">LinkedIn</span><span class="contact-value">/in/diegosaenzfalcon</span></span></a><a class="contact-item" href="https://github.com/DiegoAlejandroSaenzFalcon" target="_blank" rel="noopener noreferrer"><span class="contact-icon"><i class="ri-github-line"></i></span><span><span class="contact-label">GitHub</span><span class="contact-value">/DiegoAlejandroSaenzFalcon</span></span></a><div class="contact-item"><span class="contact-icon"><i class="ri-map-pin-line"></i></span><span><span class="contact-label">Ubicación</span><span class="contact-value">Bogotá, Colombia</span></span></div><a class="contact-item" href="https://diegoalejandrosaenzfalcon.github.io/" target="_blank" rel="noopener noreferrer"><span class="contact-icon"><i class="ri-global-line"></i></span><span><span class="contact-label">Portafolio</span><span class="contact-value">diegoalejandrosaenzfalcon.github.io</span></span></a></div></div></div></section>'''
              s=s[:start]+contact+s[end:]

          p.write_text(s,encoding='utf-8')
          print('Final corrections applied')

      - name: Validate
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/credentials/sena/sgsst.jpg
          test -s assets/credentials/sena/arh.jpg
          test -s assets/credentials/sena/adl.jpg
          grep -q 'Bogotá · Colombia' index.html
          grep -q 'credenciales-sena' index.html
          grep -q 'id="politecnico"' index.html
          grep -q 'Gestión del Talento Humano' index.html
          grep -q 'Community Management' index.html
          grep -q 'Instagram para el Desarrollo de Marcas' index.html
          grep -q 'k7Nq48l6vA5G912bzJdZ' index.html
          grep -q '3JwdxWX6meJKZ6qgaezK' index.html
          grep -q 'PEa9rZWp9P4YmD8AqQl5' index.html
          grep -q '\$80.000 COP' index.html
          grep -q 'mención de honor permanente' index.html
          grep -q 'Línea empresarial · Soluciona Inteligencia Artificial' index.html
          grep -q 'WhatsApp · Diego Saenz Falcon' index.html
          grep -q 'Sistemas<br>que' index.html

      - name: Commit final result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: publish corrected professional portfolio'
          git push
