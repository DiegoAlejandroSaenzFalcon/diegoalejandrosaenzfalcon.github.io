name: Restore Politecnico credentials

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert Politecnico credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = '<!-- POLITECNICO-CREDENTIALS-START -->'
          end = '<!-- POLITECNICO-CREDENTIALS-END -->'
          if start in text:
              print('Politecnico section already present')
              raise SystemExit(0)
          section = r'''
<!-- POLITECNICO-CREDENTIALS-START -->
<section class="section" id="politecnico">
  <div class="container">
    <div class="heading">
      <span class="eyebrow">Politécnico de Colombia</span>
      <h2>Formación complementaria <span class="gradient">aprobada.</span></h2>
      <p>Diplomados · certificación pendiente. La formación fue aprobada; la expedición de las certificaciones oficiales se encuentra pendiente de completar el proceso de pago institucional.</p>
    </div>
    <div class="sena-grid">
      <article class="sena-card">
        <div class="sena-image"><img src="https://politecnicodecolombia.edu.co/certificados/diplomados/Talento%20Humano.png" alt="Politécnico de Colombia: Gestión del Talento Humano" loading="lazy"></div>
        <div class="sena-body">
          <h3>Gestión del Talento Humano</h3>
          <p>Formación complementaria aprobada.</p>
          <div class="sena-meta"><span>Politécnico de Colombia</span><span>Certificación pendiente</span></div>
          <div class="diploma-buttons" style="margin-top:14px"><a class="small-button" href="https://politecnicodecolombia.edu.co/certificados/certificados/controlador/pagar.php?Id=k7Nq48l6vA5G912bzJdZ" target="_blank" rel="noopener noreferrer"><i class="ri-bank-card-line"></i> Expedición oficial</a></div>
        </div>
      </article>
      <article class="sena-card">
        <div class="sena-image"><img src="https://politecnicodecolombia.edu.co/certificados/diplomados/Marketing.png" alt="Politécnico de Colombia: Community Management" loading="lazy"></div>
        <div class="sena-body">
          <h3>Community Management</h3>
          <p>Formación complementaria aprobada.</p>
          <div class="sena-meta"><span>Politécnico de Colombia</span><span>Certificación pendiente</span></div>
          <div class="diploma-buttons" style="margin-top:14px"><a class="small-button" href="https://politecnicodecolombia.edu.co/certificados/certificados/controlador/pagar.php?Id=3JwdxWX6meJKZ6qgaezK" target="_blank" rel="noopener noreferrer"><i class="ri-bank-card-line"></i> Expedición oficial</a></div>
        </div>
      </article>
      <article class="sena-card">
        <div class="sena-image"><img src="https://politecnicodecolombia.edu.co/certificados/diplomados/Marketing.png" alt="Politécnico de Colombia: Instagram para el Desarrollo de Marcas" loading="lazy"></div>
        <div class="sena-body">
          <h3>Instagram para el Desarrollo de Marcas</h3>
          <p>Formación complementaria aprobada.</p>
          <div class="sena-meta"><span>Politécnico de Colombia</span><span>Certificación pendiente</span></div>
          <div class="diploma-buttons" style="margin-top:14px"><a class="small-button" href="https://politecnicodecolombia.edu.co/certificados/certificados/controlador/pagar.php?Id=PEa9rZWp9P4YmD8AqQl5" target="_blank" rel="noopener noreferrer"><i class="ri-bank-card-line"></i> Expedición oficial</a></div>
        </div>
      </article>
    </div>
    <div class="support-strip">
      <div>
        <strong>Una vía de apoyo voluntario profesional para completar estas certificaciones:</strong>
        <p>Quien desee respaldar este proceso puede realizar el pago directamente en la pasarela institucional correspondiente. El portafolio no recibe ni administra recursos. Como reconocimiento, se podrá registrar una <strong>mención de honor permanente</strong> para quien cubra voluntariamente una certificación y desee ser reconocido.</p>
      </div>
      <div class="support-price">$80.000 COP<br><small>por certificación</small></div>
    </div>
  </div>
</section>
<!-- POLITECNICO-CREDENTIALS-END -->
'''
          marker = '</main>' if '</main>' in text else '</body>'
          if marker not in text:
              raise SystemExit('No se encontró un punto de inserción')
          path.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          print('Inserted Politecnico credentials')
          PY

      - name: Validate
        run: |
          grep -Fq 'Gestión del Talento Humano' index.html
          grep -Fq 'Community Management' index.html
          grep -Fq 'Instagram para el Desarrollo de Marcas' index.html
          grep -Fq '$80.000 COP' index.html
          grep -Fq 'mención de honor permanente' index.html
          echo 'Validation OK'

      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore Politecnico credential evidence'
          git push
