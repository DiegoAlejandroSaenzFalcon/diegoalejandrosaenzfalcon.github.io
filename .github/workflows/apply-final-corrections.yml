name: Portfolio quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

      - name: Validate portfolio structure, navigation and privacy
        run: python3 scripts/validate_portfolio.py

      - name: Validate required governance files
        shell: bash
        run: |
          set -euo pipefail
          for file in AGENTS.md SECURITY.md GOVERNANCE.md llms.txt; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Validate central authority and change control
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Directivas-de-Seguridad" AGENTS.md
          grep -q "Use branches and pull requests" AGENTS.md
          grep -q "Never add secrets" AGENTS.md
          grep -q "Do not commit passwords" SECURITY.md
          grep -qi "Central Governance Authority" GOVERNANCE.md
          grep -q "presentation surface" GOVERNANCE.md
          grep -q "Portfolio governance" llms.txt

      - name: Report non-mutating CI policy
        run: echo "Validation only: CI does not edit files, commit, or push."
