name: Apply final portfolio corrections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove duplicated support block from SENA
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any raw Markdown accidentally appended after the HTML document.
          marker = '**Credenciales SENA**'
          if marker in s:
              pos = s.find(marker)
              end = s.find('</html>', pos)
              s = s[:pos] + (s[end:] if end != -1 else '\n</body></html>\n')

          sena = '<section class="section" id="credenciales-sena">'
          poly = '<section class="section" id="politecnico">'
          a = s.find(sena)
          b = s.find(poly, a)
          if a == -1 or b == -1:
              raise SystemExit('No se encontraron las secciones SENA y Politécnico.')

          block = s[a:b]
          support = block.find('<div class="support-strip">')
          if support != -1:
              closing = '</div></div></section>'
              end = block.find(closing, support)
              if end == -1:
                  raise SystemExit('No se pudo localizar el cierre del bloque SENA.')
              end += len(closing)
              block = block[:support] + block[end:]
              s = s[:a] + block + s[b:]

          # Ensure the Politécnico section remains intact and has its own support block.
          required = [
              'Gestión del Talento Humano',
              'Community Management',
              'Instagram para el Desarrollo de Marcas',
              'k7Nq48l6vA5G912bzJdZ',
              '3JwdxWX6meJKZ6qgaezK',
              'PEa9rZWp9P4YmD8AqQl5',
              '$80.000 COP',
              'mención de honor permanente'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Faltan elementos del Politécnico: ' + ', '.join(missing))

          # Navigation entry for the Politécnico section.
          nav = '<li><a href="#credenciales-sena">SENA</a></li>'
          poly_nav = '<li><a href="#politecnico">Politécnico</a></li>'
          if nav in s and poly_nav not in s:
              s = s.replace(nav, nav + poly_nav, 1)

          p.write_text(s, encoding='utf-8')
          print('SENA support duplicated block removed.')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'id="credenciales-sena"' index.html
          grep -q 'id="politecnico"' index.html
          grep -q 'Gestión del Talento Humano' index.html
          grep -q 'Community Management' index.html
          grep -q 'Instagram para el Desarrollo de Marcas' index.html
          grep -q '\$80.000 COP' index.html
          grep -q 'mención de honor permanente' index.html
          if grep -q '\*\*Credenciales SENA\*\*' index.html; then
            echo 'ERROR: Markdown leakage remains'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.find('<section class="section" id="credenciales-sena">')
          b = s.find('<section class="section" id="politecnico">', a)
          sena = s[a:b]
          if 'support-strip' in sena or '$80.000 COP' in sena:
              raise SystemExit('SENA todavía contiene el bloque de apoyo del Politécnico')
          poly = s[b:]
          if 'support-strip' not in poly or '$80.000 COP' not in poly:
              raise SystemExit('El bloque de apoyo del Politécnico desapareció')
          print('Validation OK')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-final-corrections.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: separate SENA and Politecnico credential sections'
          git push
