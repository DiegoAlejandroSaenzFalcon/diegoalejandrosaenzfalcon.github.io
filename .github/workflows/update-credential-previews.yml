name: Update credential previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-credential-previews.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate text-only Coursera cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for title in ('The Bits and Bytes of Computer Networking', 'Technical Support Fundamentals'):
              pattern = re.compile(r'<article\s+class=["\']edu["\'][^>]*>.*?<h3>\s*' + re.escape(title) + r'\s*</h3>.*?</article>', re.I | re.S)
              s = pattern.sub('', s)
          p.write_text(s, encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No duplicate Coursera cards found.'
          else
            git commit -m 'fix: remove duplicate Coursera cards [skip ci]'
            git push
          fi
