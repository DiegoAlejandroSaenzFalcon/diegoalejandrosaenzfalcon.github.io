name: Update credential previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-credential-previews.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SENA certificate viewers
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          css = '''
          .sena-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}.sena-card{background:var(--white);padding:18px}.sena-card iframe{display:block;width:100%;height:430px;border:1px solid var(--line);background:#eef1f4;margin-bottom:14px}.sena-card h3{font-size:18px;margin:0 0 7px}.sena-card p{color:var(--muted);font-size:12px;line-height:1.55;margin:0}.sena-meta{display:inline-flex;margin-top:11px;padding:6px 8px;background:var(--soft);font-size:10px;font-weight:800}.sena-link{display:inline-flex;margin-top:12px;color:var(--blue);font-size:12px;font-weight:800}@media(max-width:900px){.sena-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.sena-grid{grid-template-columns:1fr}.sena-card iframe{height:520px}}
          '''
          if '.sena-grid{' not in s:
              s=s.replace('</style></head>', css + '</style></head>', 1)

          old=re.compile(r'<div class="senna">.*?</div>', re.S)
          new='''<div class="sena"><div class="section-kicker">SENA / FORMACIÓN COMPLEMENTARIA</div><h3>Certificados SENA incorporados con evidencia visual.</h3><p>Las tres constancias fueron aportadas y se presentan mediante el visor oficial de certificados del SENA.</p><div class="sena-grid"><article class="sena-card"><iframe src="https://certificados.sena.edu.co/CertificadoDigital/com.sena.guardar?var1=9210001495565CC1070596699C" title="Certificado SENA: Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST" loading="lazy"></iframe><h3>Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST</h3><p>SENA · 50 horas · 30/08/2017</p><span class="sena-meta">CÓDIGO 9210001495565CC1070596699C</span><a class="sena-link" href="https://certificados.sena.edu.co" target="_blank" rel="noopener">Verificación oficial SENA ↗</a></article><article class="sena-card"><iframe src="https://certificados.sena.edu.co/CertificadoDigital/com.sena.guardar?var1=9208001508287CC1070596699C" title="Certificado SENA: Administración de Recursos Humanos" loading="lazy"></iframe><h3>Administración de Recursos Humanos</h3><p>SENA · 40 horas · 11/09/2017</p><span class="sena-meta">CÓDIGO 9208001508287CC1070596699C</span><a class="sena-link" href="https://certificados.sena.edu.co" target="_blank" rel="noopener">Verificación oficial SENA ↗</a></article><article class="sena-card"><iframe src="https://certificados.sena.edu.co/CertificadoDigital/com.sena.guardar?var1=9232001529759CC1070596699C" title="Certificado SENA: Administración Documental en el Entorno Laboral" loading="lazy"></iframe><h3>Administración Documental en el Entorno Laboral</h3><p>SENA · 40 horas · 09/10/2017</p><span class="sena-meta">CÓDIGO 9232001529759CC1070596699C</span><a class="sena-link" href="https://certificados.sena.edu.co" target="_blank" rel="noopener">Verificación oficial SENA ↗</a></article></div></div>'''
          if '<div class="senna">' in s:
              s=old.sub(new,s,count=1)
          elif '<div class="sena-grid">' not in s:
              marker='<section id="contacto"'
              if marker in s:
                  s=s.replace(marker,new+'\n'+marker,1)

          path.write_text(s,encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed.'
          else
            git add index.html
            git commit -m 'chore: add visual SENA credential viewers [skip ci]'
            git push
          fi
