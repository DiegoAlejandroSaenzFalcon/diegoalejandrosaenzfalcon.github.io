name: Update credential previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-credential-previews.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish supplied SENA evidence and clean duplicate Coursera entries
        shell: python
        env:
          SGSST_B64: 
          ARH_B64: 
          ADL_B64: 

      - name: Build supplied SENA image files and patch index
        shell: bash
        run: |
          set -e
          mkdir -p assets/credentials/sena
          printf '%s' "$SGSST_B64" | base64 -d > assets/credentials/sena/sgsst.jpg
          printf '%s' "$ARH_B64" | base64 -d > assets/credentials/sena/arh.jpg
          printf '%s' "$ADL_B64" | base64 -d > assets/credentials/sena/adl.jpg

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep only the visual Coursera cards; remove the older text-only cards.
          for title in ['The Bits and Bytes of Computer Networking','Technical Support Fundamentals']:
              pat = re.compile(r'<article\s+class=["\']edu["\'][^>]*>.*?<h3>\s*'+re.escape(title)+r'\s*</h3>.*?</article>', re.S|re.I)
              s = pat.sub('', s)

          # Replace SENA viewers/iframes with the supplied certificate images.
          replacements = [
              ('9210001495565CC1070596699C','assets/credentials/sena/sgsst.jpg','Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
              ('9208001508287CC1070596699C','assets/credentials/sena/arh.jpg','Administración de Recursos Humanos'),
              ('9232001529759CC1070596699C','assets/credentials/sena/adl.jpg','Administración Documental en el Entorno Laboral'),
          ]
          for code, img, alt in replacements:
              s = re.sub(r'<iframe[^>]*'+re.escape(code)+r'[^>]*></iframe>', f'<img class="sena-preview" src="{img}" alt="{alt}" loading="lazy">', s, flags=re.I|re.S)
          if '.sena-preview' not in s:
              s=s.replace('</style>', '.sena-preview{width:100%;height:430px;object-fit:contain;display:block;background:#07101d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/credentials/sena/*.jpg
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'fix: use supplied SENA evidence and remove duplicate Coursera cards [skip ci]'
            git push
          fi
