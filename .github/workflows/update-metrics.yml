name: Update professional indicators
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-metrics.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update metrics
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          start = html.find('<div class="metrics-grid">')
          if start == -1:
              raise SystemExit('metrics-grid not found')
          end = html.find('</section>', start)
          if end == -1:
              raise SystemExit('metrics section end not found')

          replacement = '''<div class="metrics-grid">
            <article class="metric">
              <div class="metric-number">19 años</div>
              <div class="metric-label">TRAYECTORIA PROFESIONAL · Experiencia en operación, logística, ventas y tecnología</div>
            </article>
            <article class="metric">
              <div class="metric-number">7 proyectos</div>
              <div class="metric-label">PORTAFOLIO TÉCNICO · Soluciones y proyectos publicados</div>
            </article>
            <article class="metric">
              <div class="metric-number">9 áreas</div>
              <div class="metric-label">CAPACIDADES · Cobertura técnica, operativa y comercial</div>
            </article>
            <article class="metric">
              <div class="metric-number">3 años</div>
              <div class="metric-label">RECONOCIMIENTO VIAL · Conducción sin incidentes reconocida</div>
            </article>
          </div>'''

          html = html[:start] + replacement + html[end:]
          path.write_text(html, encoding='utf-8')

      - name: Validate
        run: |
          test "$(grep -o '<article class="metric">' index.html | wc -l)" -eq 4
          grep -q '19 años' index.html
          grep -q '7 proyectos' index.html
          grep -q '9 áreas' index.html
          grep -q '3 años' index.html

      - name: Commit changes and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-metrics.yml
          git rm .github/workflows/update-metrics.yml
          git commit -m 'fix: refine professional portfolio indicators'
          git push
