name: Apply credential audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-credential-audit.yml'
      - '.tmp/credential-bundle.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and publish supplied SENA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/credentials/sena
          cat .tmp/credential-bundle.part1 .tmp/credential-bundle.part2 .tmp/credential-bundle.part3 .tmp/credential-bundle.part4 | tr -d '[:space:]' > /tmp/credential-bundle.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, io, tarfile
          s=Path('/tmp/credential-bundle.b64').read_text()
          s += '='*((4-len(s)%4)%4)
          raw=gzip.decompress(base64.b64decode(s))
          wanted={'SGSST.jpg':'sgsst.jpg','ARH.jpg':'arh.jpg','ADL.jpg':'adl.jpg'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as t:
              for m in t.getmembers():
                  n=Path(m.name).name
                  if n in wanted:
                      data=t.extractfile(m).read()
                      if not data.startswith(b'\xff\xd8\xff'): raise RuntimeError(n+' no es JPEG')
                      (Path('assets/credentials/sena')/wanted[n]).write_bytes(data)
          for n in wanted.values():
              p=Path('assets/credentials/sena')/n
              if not p.exists() or p.stat().st_size<1000: raise RuntimeError('Evidencia inválida: '+n)
          PY

      - name: Remove duplicate text-only Coursera entries and replace SENA viewers
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for title in ('The Bits and Bytes of Computer Networking','Technical Support Fundamentals'):
              s=re.sub(r'<article\s+class=["\']edu["\'][^>]*>.*?<h3>\s*'+re.escape(title)+r'\s*</h3>.*?</article>','',s,flags=re.I|re.S)
          repl={
            '9210001495565CC1070596699C':('sgsst.jpg','Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
            '9208001508287CC1070596699C':('arh.jpg','Administración de Recursos Humanos'),
            '9232001529759CC1070596699C':('adl.jpg','Administración Documental en el Entorno Laboral')}
          for code,(fn,title) in repl.items():
              s=re.sub(r'<iframe[^>]*'+re.escape(code)+r'[^>]*></iframe>',f'<img class="sena-preview" src="assets/credentials/sena/{fn}" alt="{title}" loading="lazy">',s,flags=re.I|re.S)
          if '.sena-preview{' not in s:
              s=s.replace('</style>','.sena-preview{width:100%;height:430px;object-fit:contain;display:block;background:#07101d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}\n</style>',1)
          p.write_text(s,encoding='utf-8')

      - name: Validate and finalize
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/credentials/sena/sgsst.jpg
          test -s assets/credentials/sena/arh.jpg
          test -s assets/credentials/sena/adl.jpg
          ! grep -q '<iframe' index.html
          rm -f .tmp/credential-bundle.b64 .tmp/credential-bundle.part1 .tmp/credential-bundle.part2 .tmp/credential-bundle.part3 .tmp/credential-bundle.part4 .tmp/sgsst.b64 .tmp/arh.b64 .tmp/adl.b64
          rm -f .github/workflows/update-credential-previews.yml .github/workflows/fix-coursera-duplicates.yml .github/workflows/apply-credential-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/credentials/sena/*.jpg .tmp .github/workflows
          git commit -m 'fix: finalize credential evidence without duplicates'
          git push
