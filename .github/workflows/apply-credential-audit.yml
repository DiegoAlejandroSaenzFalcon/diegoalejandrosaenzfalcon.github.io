name: Apply credential audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-credential-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish supplied SENA evidence and remove duplicate Coursera cards
        shell: bash
        run: |
          set -euo pipefail
          LEGACY='.github/workflows/update-credential-previews.yml'
          test -f "$LEGACY"
          mkdir -p assets/credentials/sena

          extract_b64() {
            local key="$1"
            grep -m1 -E "^[[:space:]]*${key}:[[:space:]]*" "$LEGACY" | sed -E "s/^[[:space:]]*${key}:[[:space:]]*//" | tr -d '\r\n'
          }

          SGSST_B64="$(extract_b64 SGSST_B64)"
          ARH_B64="$(extract_b64 ARH_B64)"
          ADL_B64="$(extract_b64 ADL_B64)"
          test -n "$SGSST_B64" && test -n "$ARH_B64" && test -n "$ADL_B64"
          printf '%s' "$SGSST_B64" | base64 -d > assets/credentials/sena/sgsst.jpg
          printf '%s' "$ARH_B64" | base64 -d > assets/credentials/sena/arh.jpg
          printf '%s' "$ADL_B64" | base64 -d > assets/credentials/sena/adl.jpg

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Remove only the two text-only Coursera entries; keep their visual certificate cards.
          for title in ('The Bits and Bytes of Computer Networking', 'Technical Support Fundamentals'):
              pattern = re.compile(
                  r'<article\\s+class=["\']edu["\'][^>]*>.*?<h3>\\s*' + re.escape(title) + r'\\s*</h3>.*?</article>',
                  re.I | re.S,
              )
              s = pattern.sub('', s)

          # Replace the three SENA certificate viewers with the supplied certificate images.
          replacements = {
              '9210001495565CC1070596699C': ('sgsst.jpg', 'Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
              '9208001508287CC1070596699C': ('arh.jpg', 'Administración de Recursos Humanos'),
              '9232001529759CC1070596699C': ('adl.jpg', 'Administración Documental en el Entorno Laboral'),
          }
          for code, (filename, title) in replacements.items():
              img = f'<img class="sena-preview" src="assets/credentials/sena/{filename}" alt="{title}" loading="lazy">'
              s, n = re.subn(r'<iframe[^>]*' + re.escape(code) + r'[^>]*></iframe>', img, s, flags=re.I | re.S)
              if n == 0 and f'assets/credentials/sena/{filename}' not in s:
                  raise RuntimeError(f'SENA viewer not found for {code}')

          css = '.sena-preview{width:100%;height:430px;object-fit:contain;display:block;background:#07101d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}'
          if '.sena-preview{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validate final result
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/credentials/sena/sgsst.jpg
          test -s assets/credentials/sena/arh.jpg
          test -s assets/credentials/sena/adl.jpg
          test "$(grep -o 'class=\"sena-card\"' index.html | wc -l | tr -d ' ')" = "3"
          ! grep -q '<iframe[^>]*9210001495565CC1070596699C' index.html
          ! grep -q '<iframe[^>]*9208001508287CC1070596699C' index.html
          ! grep -q '<iframe[^>]*9232001529759CC1070596699C' index.html

      - name: Remove obsolete workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/update-credential-previews.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/credentials/sena/*.jpg .github/workflows/update-credential-previews.yml
          git commit -m 'fix: publish supplied SENA evidence and remove duplicate Coursera cards'
          git push
