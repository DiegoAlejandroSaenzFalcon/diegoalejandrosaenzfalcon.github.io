name: Apply credential audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-credential-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish supplied SENA evidence and remove duplicate Coursera cards
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF='f166b74beeea5883909ac9ae75fb34e397ef037b'
          git show "$SOURCE_REF:.github/workflows/update-credential-previews.yml" > /tmp/legacy.yml
          mkdir -p assets/credentials/sena

          extract_b64() {
            local key="$1"
            awk -v k="$key" 'index($0, k ":") {sub("^.*" k ": *", ""); print; exit}' /tmp/legacy.yml | tr -d '\r\n'
          }

          SGSST_B64="$(extract_b64 SGSST_B64)"
          ARH_B64="$(extract_b64 ARH_B64)"
          ADL_B64="$(extract_b64 ADL_B64)"
          test -n "$SGSST_B64" && test -n "$ARH_B64" && test -n "$ADL_B64"
          printf '%s' "$SGSST_B64" | base64 -d > assets/credentials/sena/sgsst.jpg
          printf '%s' "$ARH_B64" | base64 -d > assets/credentials/sena/arh.jpg
          printf '%s' "$ADL_B64" | base64 -d > assets/credentials/sena/adl.jpg

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Remove only the two old text-only Coursera entries; keep the visual certificate cards.
          for title in ('The Bits and Bytes of Computer Networking', 'Technical Support Fundamentals'):
              pattern = re.compile(
                  r'<article\s+class=["\']edu["\'][^>]*>.*?<h3>\s*' + re.escape(title) + r'\s*</h3>.*?</article>',
                  re.I | re.S,
              )
              s = pattern.sub('', s)

          # Convert SENA viewers/cards to the three supplied certificate images.
          image_paths = [
              ('assets/credentials/sena/sgsst.jpg', 'Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
              ('assets/credentials/sena/arh.jpg', 'Administración de Recursos Humanos'),
              ('assets/credentials/sena/adl.jpg', 'Administración Documental en el Entorno Laboral'),
          ]

          # First handle iframes that contain the official verification codes.
          for code, (src, title) in zip(
              ('9210001495565CC1070596699C', '9208001508287CC1070596699C', '9232001529759CC1070596699C'),
              image_paths,
          ):
              img = f'<img class="sena-preview" src="{src}" alt="{title}" loading="lazy">'
              s = re.sub(r'<iframe[^>]*' + re.escape(code) + r'[^>]*></iframe>', img, s, flags=re.I | re.S)

          # Then normalize any existing SENA cards by order, covering previous image-based revisions.
          pattern = re.compile(r'(<article\s+class=["\']sena-card["\'][^>]*>.*?<img\b[^>]*\bsrc=["\'])[^"\']*(\1?)', re.I | re.S)
          starts = list(re.finditer(r'<article\s+class=["\']sena-card["\'][^>]*>', s, re.I))
          if len(starts) >= 3:
              ranges = []
              for idx, m in enumerate(starts[:3]):
                  end = starts[idx+1].start() if idx + 1 < len(starts) else s.find('</div></div>', m.end())
                  if end == -1: end = len(s)
                  block = s[m.start():end]
                  block = re.sub(r'(<img\b[^>]*\bsrc=["\'])[^"\']*( ["\'])', lambda mm: mm.group(1) + image_paths[idx][0] + mm.group(2), block, count=1, flags=re.I)
                  ranges.append((m.start(), end, block))
              for a,b,block in reversed(ranges):
                  s = s[:a] + block + s[b:]

          if '.sena-preview{' not in s:
              s = s.replace('</style>', '.sena-preview{width:100%;height:430px;object-fit:contain;display:block;background:#07101d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}\n</style>', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validate final result
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/credentials/sena/sgsst.jpg
          test -s assets/credentials/sena/arh.jpg
          test -s assets/credentials/sena/adl.jpg
          test "$(grep -o 'class=\"sena-card\"' index.html | wc -l | tr -d ' ')" = "3"
          ! grep -q '<iframe[^>]*9210001495565CC1070596699C' index.html
          ! grep -q '<iframe[^>]*9208001508287CC1070596699C' index.html
          ! grep -q '<iframe[^>]*9232001529759CC1070596699C' index.html
          test "$(grep -o 'The Bits and Bytes of Computer Networking' index.html | wc -l | tr -d ' ')" = "2"
          test "$(grep -o 'Technical Support Fundamentals' index.html | wc -l | tr -d ' ')" = "2"

      - name: Remove temporary workflows and commit final state
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/update-credential-previews.yml .github/workflows/fix-coursera-duplicates.yml .github/workflows/apply-credential-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/credentials/sena/*.jpg
          git commit -m 'fix: finalize credential evidence without duplicates'
          git push
