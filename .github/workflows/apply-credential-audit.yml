name: Apply credential audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-credential-audit.yml'
      - '.tmp/*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode supplied SENA evidence and clean duplicate Coursera entries
        shell: python
        run: |
          from pathlib import Path
          import base64, re

          out = Path('assets/credentials/sena')
          out.mkdir(parents=True, exist_ok=True)
          payloads = {
              'sgsst.jpg': Path('.tmp/sgsst.b64'),
              'arh.jpg': Path('.tmp/arh.b64'),
              'adl.jpg': Path('.tmp/adl.b64'),
          }
          for filename, src in payloads.items():
              raw = src.read_text(encoding='utf-8')
              compact = re.sub(r'\s+', '', raw)
              compact += '=' * ((4 - len(compact) % 4) % 4)
              try:
                  data = base64.b64decode(compact, validate=False)
              except Exception as exc:
                  raise RuntimeError(f'Invalid base64 in {src}: {exc}')
              if not data.startswith(b'\xff\xd8\xff'):
                  raise RuntimeError(f'{src} did not decode to a JPEG')
              (out / filename).write_bytes(data)
              print(f'{src}: decoded {len(data)} bytes -> {filename}')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for title in ('The Bits and Bytes of Computer Networking', 'Technical Support Fundamentals'):
              s = re.sub(
                  r'<article\s+class=["\']edu["\'][^>]*>.*?<h3>\s*' + re.escape(title) + r'\s*</h3>.*?</article>',
                  '', s, flags=re.I | re.S
              )

          repl = {
              '9210001495565CC1070596699C': ('sgsst.jpg', 'Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
              '9208001508287CC1070596699C': ('arh.jpg', 'Administración de Recursos Humanos'),
              '9232001529759CC1070596699C': ('adl.jpg', 'Administración Documental en el Entorno Laboral'),
          }
          for code, (fn, title) in repl.items():
              img = f'<img class="sena-preview" src="assets/credentials/sena/{fn}" alt="{title}" loading="lazy">'
              s = re.sub(r'<iframe[^>]*' + re.escape(code) + r'[^>]*></iframe>', img, s, flags=re.I | re.S)

          cards = list(re.finditer(r'<article\s+class=["\']sena-card["\'][^>]*>', s, re.I))
          order = [
              ('sgsst.jpg', 'Sistema de Gestión de la Seguridad y Salud en el Trabajo SG-SST'),
              ('arh.jpg', 'Administración de Recursos Humanos'),
              ('adl.jpg', 'Administración Documental en el Entorno Laboral'),
          ]
          if len(cards) >= 3:
              for i in range(2, -1, -1):
                  start = cards[i].start()
                  end = cards[i+1].start() if i + 1 < len(cards) else len(s)
                  block = s[start:end]
                  img = f'<img class="sena-preview" src="assets/credentials/sena/{order[i][0]}" alt="{order[i][1]}" loading="lazy">'
                  block = re.sub(r'<img\b[^>]*class=["\']sena-preview["\'][^>]*>', img, block, count=1, flags=re.I | re.S)
                  s = s[:start] + block + s[end:]
          if '.sena-preview{' not in s:
              s = s.replace('</style>', '.sena-preview{width:100%;height:430px;object-fit:contain;display:block;background:#07101d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}\n</style>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate final portfolio
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/credentials/sena/sgsst.jpg
          test -s assets/credentials/sena/arh.jpg
          test -s assets/credentials/sena/adl.jpg
          test "$(grep -o 'class=\"sena-card\"' index.html | wc -l | tr -d ' ')" = "3"
          ! grep -q '<iframe' index.html

      - name: Finalize and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/sgsst.b64 .tmp/arh.b64 .tmp/adl.b64
          rm -f .github/workflows/update-credential-previews.yml .github/workflows/fix-coursera-duplicates.yml .github/workflows/apply-credential-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/credentials/sena/*.jpg .tmp .github/workflows
          git commit -m 'fix: finalize credential evidence without duplicates'
          git push
