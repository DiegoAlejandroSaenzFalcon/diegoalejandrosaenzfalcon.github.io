name: Fix Coursera duplicates

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/fix-coursera-duplicates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy text-only Coursera cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for title in ('The Bits and Bytes of Computer Networking', 'Technical Support Fundamentals'):
              pattern = re.compile(r'<article\s+class=["\x27]edu["\x27][^>]*>.*?<h3>\s*' + re.escape(title) + r'\s*</h3>.*?</article>', re.I | re.S)
              s = pattern.sub('', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remove duplicate Coursera cards [skip ci]'
          git push
